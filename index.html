    <title>⌨️ 键盘侠</title>
    <style>
        :root {
            --bg: #f5f7fa; --card: #ffffff; --text: #2c3e50; --sub: #95a5a6;

            --overlay-bg: rgba(255,255,255,0.92); --overlay-blur: blur(8px);
            --result-bg: #ffffff; --result-border: rgba(44,62,80,0.12);
        }
        [data-theme="retro"] {
            --bg: #d4c5a9; --card: #f5ecd7; --text: #4a3728; --sub: #8b7355;
            --primary: #c0392b; --success: #27ae60; --error: #c0392b;
            --cursor: #c0392b; --char-default: #8b7355;
            --tooltip-bg: #4a3728; --tooltip-text: #f5ecd7; --radius: 20px;
            --card-blur: none; --card-border: transparent; --card-shadow: 0 12px 40px rgba(0,0,0,0.06);
            --btn-color: #fff; --stats-bg: color-mix(in srgb, var(--sub) 8%, transparent);

            --result-bg: #f5ecd7; --result-border: rgba(74,55,40,0.18);
        }
        [data-theme="gradient"] {
            --bg: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --card: rgba(255, 255, 255, 0.06); --text: #e8e6f0; --sub: #9088b8;
            --primary: #a78bfa; --success: #6ee7b7; --error: #fca5a5;
            --cursor: #a78bfa; --char-default: #6b6394;
            --tooltip-bg: rgba(255,255,255,0.95); --tooltip-text: #1e1b4b; --radius: 20px;
            --card-blur: blur(20px) saturate(1.4); --card-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 12px 40px rgba(0,0,0,0.3); --btn-color: #0f0c29;
            --stats-bg: color-mix(in srgb, var(--sub) 8%, transparent);
            --overlay-bg: rgba(15,12,41,0.92); --overlay-blur: blur(16px);

        }
        [data-theme="glass-dark"] {
            --bg: radial-gradient(1100px 550px at 75% -10%, rgba(56, 189, 248, 0.16), transparent 60%),
                  radial-gradient(900px 500px at 5% 110%, rgba(168, 85, 247, 0.18), transparent 60%), #070714;
            --card: rgba(255, 255, 255, 0.055); --text: #eef0f6; --sub: #7d8099;
            --primary: #38bdf8; --success: #34d399; --error: #fb7185;
            --cursor: #38bdf8; --char-default: #4e5168;
            --tooltip-bg: rgba(15, 17, 30, 0.88); --tooltip-text: #eef0f6; --radius: 24px;
            --card-blur: blur(28px) saturate(1.6) brightness(1.06);
            --card-border: rgba(255, 255, 255, 0.10);
            --card-shadow: 0 16px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
            --btn-color: #061020; --stats-bg: rgba(255, 255, 255, 0.04);
            --overlay-bg: rgba(7, 7, 20, 0.82); --overlay-blur: blur(32px) saturate(1.4);
            --result-bg: #111323; --result-border: rgba(255,255,255,0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0;
            filter: blur(80px); transition: opacity 0.6s ease;
        }
        html[data-theme="glass-dark"] body::before {
            opacity: 1; width: 45vw; height: 45vw; max-width: 620px; max-height: 620px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.5), transparent 65%);
            top: -12%; left: -8%; animation: drift1 20s ease-in-out infinite alternate;
        }
        html[data-theme="glass-dark"] body::after {
            opacity: 1; width: 42vw; height: 42vw; max-width: 560px; max-height: 560px;
            background: radial-gradient(circle, rgba(232, 88, 190, 0.4), transparent 65%);
            bottom: -14%; right: -8%; animation: drift2 26s ease-in-out infinite alternate;
        }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(12vw, 10vh) scale(1.15); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-10vw, -8vh) scale(0.95); } }

        .container {
            background: var(--card); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--card-border); width: 100%; max-width: 820px;
            padding: 44px; border-radius: var(--radius); box-shadow: var(--card-shadow); position: relative; z-index: 1;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .theme-switcher { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-btn {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
            cursor: pointer; opacity: 0.6; transition: all 0.2s;
        }
        .theme-btn:hover, .theme-btn.active { opacity: 1; transform: scale(1.15); border-color: var(--text); }
        .theme-btn[data-t="retro"] { background: #d4c5a9; }
        .theme-btn[data-t="gradient"] { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); border: 1px solid rgba(255,255,255,0.3); }
        .theme-btn[data-t="glass-dark"] { background: linear-gradient(135deg, rgba(56,189,248,0.85), rgba(232,88,190,0.85)); border: 1px solid rgba(255,255,255,0.4); }

        /* 沉浸模式只改变可见性，保留原有占位，避免正文因组件消失而跳动 */
        .header, .btn-row, .tip {
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s;
        }
        .container.immersive .header,
        .container.immersive .btn-row,
        .container.immersive .tip {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s 0.35s;
        }
        .container.immersive .header { transform: translateY(-8px); }
        .container.immersive .btn-row,
        .container.immersive .tip { transform: translateY(8px); }

        .quote-display {
            font-size: 24px; line-height: 2; text-align: left; margin-bottom: 25px; padding: 28px;
            background: color-mix(in srgb, var(--sub) 5%, transparent); border-radius: 16px; border: 2px solid transparent;
            user-select: none; word-break: break-word; min-height: 120px; cursor: text; position: relative;
        }
        [data-theme="glass-dark"] .quote-display { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
        .quote-display.active { border-color: var(--primary); }
        .quote-display.loading { pointer-events: none; opacity: 0.6; }
        .loading-spinner {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: var(--sub); gap: 8px;
        }
        .loading-spinner::before {
            content: ''; width: 18px; height: 18px; border: 2px solid var(--sub);
            border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .char { color: var(--char-default); position: relative; border-radius: 2px; padding: 0 1px; }
        .char.correct { color: var(--success); }
        .char.incorrect { color: var(--error); background: color-mix(in srgb, var(--error) 12%, transparent); }
        .char.current::before {
            content: ''; position: absolute; left: 0; bottom: 2px; width: 100%; height: 3px;
            background: var(--cursor); animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 透明但「非零尺寸」的绝对定位输入框：作为 IME 锚点，跟随当前待输入字符 */
        /* 注意1：这里不要写 left/top 的 !important —— 样式表里的 !important 优先级
           高于 JS 写的普通行内样式，会导致 syncInputPosition() 的坐标永远不生效 */
        /* 注意2：width/height 不能是 0！Edge/Win11 输入法(TSF)对 0 尺寸输入框取不到
           有效光标矩形，候选窗会完全不弹出 */
        /* 固定宽度配合右对齐，拼音向左展开；组字过程不改变元素矩形，
           Windows 输入法候选窗因此不会随每个拼音字母重新定位 */
        .input-field {
            position: absolute !important;
            left: 0;
            top: 0;
            opacity: 0 !important;
            width: 320px !important;
            height: 36px !important;
            font-size: 24px !important;   /* 与正文同字号，光标矩形度量贴近真实字符 */
            line-height: 36px !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            outline: none !important;
            resize: none !important;
            background: transparent !important;
            color: transparent !important;
            caret-color: transparent !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            white-space: nowrap !important;  /* 禁止换行 */
            text-align: right !important;
            letter-spacing: 0;
            overflow: hidden !important;
            word-wrap: normal !important;
            overflow-wrap: normal !important;
            transition: none !important;
            animation: none !important;
        }

        .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            background: var(--primary); color: var(--btn-color); border: none;
            padding: 14px 36px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer;
        }
        [data-theme="gradient"] .btn { background: linear-gradient(135deg, #a78bfa, #818cf8); color: #0f0c29; box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3); }
        [data-theme="glass-dark"] .btn { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #061020; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35); }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }
        .tip { margin-top: 20px; font-size: 13px; color: var(--sub); text-align: center; }
        .tip #sourceTag { color: var(--primary); font-weight: 700; }

        .overlay {
            position: absolute; inset: 0; border-radius: var(--radius);
            background: var(--overlay-bg); backdrop-filter: var(--overlay-blur); -webkit-backdrop-filter: var(--overlay-blur);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 5;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .result-panel {
            width: min(440px, calc(100% - 40px)); padding: 32px 28px; text-align: center;
            background: var(--result-bg); border: 1px solid var(--result-border); border-radius: 8px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.28);
            position: relative; z-index: 1;   /* 压在烟花画布之上，保证文字可读 */
        }
        .overlay h2 { font-size: 30px; margin-bottom: 10px; color: var(--success); }
        .overlay p { font-size: 17px; color: var(--sub); margin-bottom: 25px; }

        /* 🎆 完成庆祝：全屏烟花 —— 脱离 .container/.overlay 的限制，固定铺满视口并盖在最顶层
           （overlay 上有 backdrop-filter，会成为 fixed 定位的包含块，所以画布必须放在 body 下）
           pointer-events:none 保证不挡住「再来一篇」按钮的点击 */
        .fx-canvas {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999;
        }

        /* 🖱️ 打字中隐藏鼠标：沉浸感优先。移动鼠标 / 完成 / 退出沉浸时自动恢复 */
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }
        /* 💬 完成页随机名人名言 */
        .quote-card {
            margin: 0 auto 22px; padding: 14px 16px; text-align: left;
            border-left: 3px solid var(--primary);
            background: color-mix(in srgb, var(--primary) 9%, transparent);
            border-radius: 8px; animation: rise 0.5s ease both;
        }
        .quote-tone {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background: color-mix(in srgb, var(--primary) 16%, transparent);
            border-radius: 999px; padding: 2px 10px; margin-bottom: 8px;
        }
        .quote-text { font-size: 16px; line-height: 1.7; color: var(--text); margin-bottom: 6px; }
        .quote-author { font-size: 13px; color: var(--sub); text-align: right; margin: 0; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .quote-card { animation: none; }
        }
    </style>

<script>
    // ==================== 内置短文库（仅作线上不可用时的兜底）====================
    const localEssays = [
        "曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。",
        "盼望着，盼望着，东风来了，春天的脚步近了。一切都像刚睡醒的样子，欣欣然张开了眼。山朗润起来了，水涨起来了，太阳的脸红起来了。小草偷偷地从土里钻出来，嫩嫩的，绿绿的。",
        "燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？是有人偷了他们罢，那是谁？又藏在何处呢？",
        "我冒了严寒，回到相隔二千余里，别了二十余年的故乡去。时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。",
        "对于一个在北平住惯的人，像我，冬天要是不刮风，便觉得是奇迹；济南的冬天是没有风声的。对于一个刚由伦敦回来的人，像我，冬天要能看得见日光，便觉得是怪事；济南的冬天是响晴的。",
        "为了看日出，我常常早起。那时天还没有大亮，周围非常清静，船上只有机器的响声。天空还是一片浅蓝，颜色很浅。转眼间天边出现了一道红霞，慢慢地在扩大它的范围，加强它的亮光。",
        "设计者和匠师们因地制宜，自出心裁，修建成功的园林当然各各不同。可是苏州各个园林在不同之中有个共同点，似乎设计者和匠师们一致追求的是：务必使游览者无论站在哪个点上，眼前总是一幅完美的图画。",
        "我们生而孤独，我们死而孤独。然而，正是在这两者之间，我们有机会去爱，去创造，去建立联系。正是这些联系，让我们短暂的生命拥有了永恒的意义。不要害怕孤独，但更要珍惜每一次相遇。",
        "生活不是等待风暴过去，而是学会在雨中翩翩起舞。每一天都是一个新的开始，无论昨天发生了什么，今天你都有机会重新书写自己的故事。保持热爱，奔赴山海，愿你眼里有光，心中有爱。",
        "所有的努力都不会白费，它们只是在等待一个合适的时机。就像种子埋在土里，看不见光，也听不见声音，但它从未停止生长。你要做的，是在看不到结果的日子里，依然按时浇水，依然相信春天。",
        "编程不仅仅是一门技术，更是一种思维方式。它教会我们如何将复杂的问题分解为简单的步骤，如何用逻辑构建世界，如何在失败中不断调试与迭代。每一个优秀的程序员，本质上都是一个乐观的问题解决者。",
        "The quick brown fox jumps over the lazy dog. This is a classic pangram used to test typewriters and computer keyboards because it uses every letter in the English alphabet at least once.",
        "To be, or not to be, that is the question: whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune, or to take arms against a sea of troubles and by opposing end them."
    ];

    const $ = id => document.getElementById(id);
    const quoteDisplay = $('quoteDisplay');
    const quoteInput = $('quoteInput');
    const container = document.querySelector('.container');
    const overlay = $('finishOverlay');
    const newQuoteBtn = $('newQuoteBtn'), sourceTag = $('sourceTag');

    let state = {
        quote: '', startTime: null,
        isTyping: false, isComposing: false,
        correctCount: 0, totalConfirmed: 0, confirmedValue: '',
        firstConfirmTime: null, lastConfirmTime: null,
        isLoading: false, isComplete: false
    };

    // IME 锚点：跟随当前待输入字符，但只在「非组字」时刻更新（见 syncInputPosition）。
    let imeAnchor = null;

    // ==================== 主题切换 ====================
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', btn.dataset.t);

    // 已知限制：一言 80 字以上语料实测仅个位数条，拉完一轮会自然回落到内置短文兜底；
    // 拉取端连续 5 次只返回重复/过短内容（语料枯竭）→ 本会话停用线上，避免反复发无效请求。
    const ONLINE_URL = 'https://v1.hitokoto.cn/?c=d&c=e&c=f&c=k&min_length=80&max_length=400&encode=json';
    const NET_TIMEOUT = 4000;          // 单次请求超时（首屏/换篇最多等这么久就兜底）
    const RETRY_COOLDOWN = 3000;       // 网络失败冷却：冷却期内不主动发请求
    const MIN_TEXT_LEN = 80;           // 短于它不算「短文」，丢弃重试
    const seenOnline = new Set();
    let onlineQueue = [], onlineBusy = false;
    let onlineDone = false;            // 语料枯竭（不是网络问题）→ 本会话转纯本地
    let dupMisses = 0, netFails = 0;   // 连续「内容不合格」「网络失败」计数
    let lastNetFail = 0;               // 上次网络失败时刻（冷却期内换篇即点即出，不干等）
    let retryTimer = null;             // 网络恢复后的后台自动重试（指数退避，最长 30s 一次）

    function onlineCanTry() { return !onlineDone && Date.now() - lastNetFail >= RETRY_COOLDOWN; }

    function scheduleRetry() {
        if (retryTimer || onlineDone) return;                 // 已有排期则不叠加
        const wait = Math.min(RETRY_COOLDOWN * (2 ** Math.min(netFails - 1, 4)), 30000);
        retryTimer = setTimeout(() => { retryTimer = null; prefetchOnline(); }, wait);
    }

    /** 拉一篇可用线上短文：成功返回文本并入库；失败返回 null（不抛错）。同一时刻至多一个请求。 */
    async function pullOnline() {
        if (onlineBusy) return null;
        onlineBusy = true;
        try {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), NET_TIMEOUT);
            let res;
            try { res = await fetch(ONLINE_URL, { signal: ctl.signal }); }
            finally { clearTimeout(timer); }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const text = (data.hitokoto || '').trim().replace(/<[^>]*>/g, '').replace(/\s+/g, ' ');
            if (text.length < MIN_TEXT_LEN) throw new Error('TOO_SHORT');
            if (seenOnline.has(text) || localEssays.includes(text)) throw new Error('DUP');
            seenOnline.add(text);
            dupMisses = 0; netFails = 0;                       // 成功 → 连续失败计数清零
            return text;
        } catch (err) {
            console.warn('在线短文不可用：', err.message);
            if (err.message === 'TOO_SHORT' || err.message === 'DUP') {
                if (++dupMisses >= 5) { onlineDone = true; console.warn('线上长文语料已拉完，转入内置短文兜底'); }
            } else {
                lastNetFail = Date.now();                      // 网络故障：进冷却并安排后台自动重试
                netFails++;
                scheduleRetry();
            }
            return null;
        } finally { onlineBusy = false; }
    }

    /** 后台补库存：队列不足 2 篇且允许请求时再拉一篇（网络恢复后由它把线上带回来） */
    async function prefetchOnline() {
        if (onlineBusy || onlineQueue.length >= 2 || !onlineCanTry()) return;
        const text = await pullOnline();
        if (text) onlineQueue.push(text);
    }

    // ==================== 核心逻辑 ====================
    function resetState() {
        Object.assign(state, {
            startTime: null, isTyping: false, isComposing: false,
            correctCount: 0, totalConfirmed: 0, confirmedValue: '',
            firstConfirmTime: null, lastConfirmTime: null,
            isComplete: false
        });
    }

    /** 换篇占位 UI：拉取期间清空文字区并显示 spinner，防止旧文被误读为新文 */
    let pendingReload = false;           // 拉取中再次触发换篇 → 结束后自动补一次
    function setLoadingUI(on) {
        quoteDisplay.classList.toggle('loading', on);
        quoteDisplay.classList.remove('active');
        if (on) {
            quoteDisplay.innerHTML = '';
            const sp = document.createElement('div');
            sp.className = 'loading-spinner';
            sp.textContent = '正在获取线上短文…';
            quoteDisplay.appendChild(sp);
        }
    }

    /** 换篇取文：线上短文是第一来源；本地短文只在拿不到线上时兜底 */
    async function loadNewQuote() {
        if (state.isLoading) { pendingReload = true; return; }
        exitImmersive();
        stopFireworks();      // 开新一篇：清掉上一轮的烟花与残留粒子
        state.isLoading = true;
        try {
            let text = null, source = '线上短文';
            if (onlineQueue.length) {
                text = onlineQueue.shift();                    // 后台已备好 → 即点即出
            } else if (onlineCanTry()) {
                const spT = setTimeout(() => setLoadingUI(true), 120);  // 超过 120ms 才亮 spinner，防瞬闪
                text = await pullOnline();
                clearTimeout(spT); setLoadingUI(false);
            }
            if (!text) {                                       // 断网/超时/源挂/语料枯竭 → 内置兜底
                source = '本地短文（兜底）';
                do { text = localEssays[Math.floor(Math.random() * localEssays.length)]; }
                while (localEssays.length > 1 && text === state.quote);
            }
            resetState();
            state.quote = text;
            renderQuote(); quoteInput.value = ''; state.confirmedValue = '';
            quoteInput.focus(); overlay.classList.remove('show');
            sourceTag.textContent = source;
            prefetchOnline();                                  // 用掉一篇，后台顺手补一篇
        } finally {
            state.isLoading = false;
            if (pendingReload) { pendingReload = false; loadNewQuote(); }
        }
    }

    function renderQuote() {
        quoteDisplay.innerHTML = '';
        [...state.quote].forEach((char, i) => {
            const span = document.createElement('span');
            span.textContent = char; span.className = 'char';
            if (i === 0) span.classList.add('current');
            quoteDisplay.appendChild(span);
        });
        imeAnchor = null;
        syncInputPosition(true);
    }

    /** 只记起点，不做每秒刷新。暂停功能已移除 —— 用时就是「开始 → 完成」的墙钟时间 */
    function startTimer() {
        state.startTime = Date.now();
    }
    function getEffectiveElapsed() {
        return state.startTime ? Date.now() - state.startTime : 0;
    }

    // 成绩只在完成页结算一次（不在打字过程里刷新，注意力只留在文字上）
    function computeWPM() {
        if (!state.firstConfirmTime || !state.lastConfirmTime) return 0;
        const ms = state.lastConfirmTime - state.firstConfirmTime;
        if (ms <= 0) return state.correctCount > 0 ? '—' : 0;
        const hasCn = /[\u4e00-\u9fff]/.test(state.quote);
        const words = hasCn ? state.correctCount : state.correctCount / 5;
        return Math.max(0, Math.round(words / (ms / 60000)));
    }
    function computeAccuracy() {
        return state.totalConfirmed > 0 ? Math.round(state.correctCount / state.totalConfirmed * 100) : 100;
    }
    // ==================== 🎆 完成庆祝：随机名人名言 + 烟花 ====================
    // 目的不是打分，而是给「又坚持打完一篇」这件事一点情绪回报。
    // 三类语气：鼓励（低谷时推一把）、加油（往前看）、赞美（肯定你刚做到的事）。
    const CELEBRATION_QUOTES = [
        { tone: '鼓励', text: '路漫漫其修远兮，吾将上下而求索。', author: '屈原' },
        { tone: '鼓励', text: '天行健，君子以自强不息。', author: '《周易》' },
        { tone: '鼓励', text: '不积跬步，无以至千里；不积小流，无以成江海。', author: '荀子' },
        { tone: '鼓励', text: '古之立大事者，不惟有超世之才，亦必有坚忍不拔之志。', author: '苏轼' },
        { tone: '鼓励', text: '世上无难事，只要肯登攀。', author: '毛泽东' },
        { tone: '鼓励', text: '一个人的价值，应该看他贡献什么，而不应当看他取得什么。', author: '爱因斯坦' },
        { tone: '鼓励', text: '如果你因错过了太阳而流泪，那么你也将错过群星了。', author: '泰戈尔' },
        { tone: '鼓励', text: '千淘万漉虽辛苦，吹尽狂沙始到金。', author: '刘禹锡' },
        { tone: '加油', text: '长风破浪会有时，直挂云帆济沧海。', author: '李白' },
        { tone: '加油', text: '千磨万击还坚劲，任尔东西南北风。', author: '郑板桥' },
        { tone: '加油', text: '会当凌绝顶，一览众山小。', author: '杜甫' },
        { tone: '加油', text: '骐骥一跃，不能十步；驽马十驾，功在不舍。', author: '荀子' },
        { tone: '加油', text: '业精于勤，荒于嬉；行成于思，毁于随。', author: '韩愈' },
        { tone: '加油', text: '伟大的作品不是靠力量完成的，而是靠坚持完成的。', author: '塞缪尔·约翰逊' },
        { tone: '加油', text: '成功不是终点，失败也并非末日，重要的是继续前进的勇气。', author: '丘吉尔' },
        { tone: '加油', text: '锲而舍之，朽木不折；锲而不舍，金石可镂。', author: '荀子' },
        { tone: '赞美', text: '天才就是百分之一的灵感加上百分之九十九的汗水。', author: '爱迪生' },
        { tone: '赞美', text: '哪里有天才，我是把别人喝咖啡的工夫都用在工作上的。', author: '鲁迅' },
        { tone: '赞美', text: '大鹏一日同风起，扶摇直上九万里。', author: '李白' },
        { tone: '赞美', text: '春风得意马蹄疾，一日看尽长安花。', author: '孟郊' },
        { tone: '赞美', text: '我们反复做的事造就了我们，卓越因此不是一种行为，而是一种习惯。', author: '威尔·杜兰特' },
        { tone: '赞美', text: '种一棵树最好的时间是十年前，其次是现在。', author: '谚语' },
        { tone: '赞美', text: '凡是过往，皆为序章。', author: '莎士比亚' },
        { tone: '赞美', text: '宝剑锋从磨砺出，梅花香自苦寒来。', author: '谚语' }
    ];
    const fxCanvas = $('fxCanvas'), fxCtx = fxCanvas.getContext('2d');
    const celebCard = $('celebrationCard'), celebTone = $('celebrationTone'),
          celebText = $('celebrationText'), celebAuthor = $('celebrationAuthor');

    let lastCelebration = '';
    function pickCelebration() {
        let pick;
        do { pick = CELEBRATION_QUOTES[Math.floor(Math.random() * CELEBRATION_QUOTES.length)]; }
        while (CELEBRATION_QUOTES.length > 1 && pick.text === lastCelebration);
        lastCelebration = pick.text;
        return pick;
    }
    function showCelebration() {
        const { tone, text, author } = pickCelebration();
        celebTone.textContent = tone;
        celebText.textContent = text;
        celebAuthor.textContent = '—— ' + author;
        celebCard.style.animation = 'none';     // 重启入场动画
        void celebCard.offsetWidth;
        celebCard.style.animation = '';
    }

    // ---- 烟花：轻量 canvas 粒子，放完自动停止，不留后台 RAF ----
    let fxRaf = null, fxParts = [], fxUntil = 0, fxNext = 0, fxDpr = 1;
    function sizeFx() {
        // 全屏画布：直接按视口取尺寸（用 100vw 会在出现滚动条时比视口宽出一截）
        fxDpr = Math.min(window.devicePixelRatio || 1, 2);
        fxCanvas.width = Math.max(1, Math.round(window.innerWidth * fxDpr));
        fxCanvas.height = Math.max(1, Math.round(window.innerHeight * fxDpr));
        fxCtx.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
    }
    function spawnShell() {
        const w = fxCanvas.width / fxDpr, h = fxCanvas.height / fxDpr;
        // 全屏铺开：横向 8%~92%、纵向 8%~62% 随机取弹着点
        const scale = Math.min(2.2, Math.max(1, h / 520));   // 大屏等比放大爆散半径/重力，观感与在小面板时一致
        const cx = w * (0.08 + Math.random() * 0.84);
        const cy = h * (0.08 + Math.random() * 0.54);
        const hue = Math.floor(Math.random() * 360);
        const n = 46 + Math.floor(Math.random() * 28);
        for (let i = 0; i < n; i++) {
            const a = (Math.PI * 2 * i) / n + Math.random() * 0.15;
            const sp = (1.5 + Math.random() * 2.8) * scale;
            fxParts.push({
                x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                g: 0.045 * scale,
                life: 1, decay: 0.011 + Math.random() * 0.012,
                hue: (hue + Math.random() * 40 - 20 + 360) % 360,
                size: (1.4 + Math.random() * 1.8) * Math.min(1.6, scale)
            });
        }
    }
    function fxStep() {
        const w = fxCanvas.width / fxDpr, h = fxCanvas.height / fxDpr;
        fxCtx.clearRect(0, 0, w, h);
        // 浅色主题用正常混合（叠加在白底上会发白），深色主题用叠加更绚烂
        const light = document.documentElement.getAttribute('data-theme') === 'retro';
        fxCtx.globalCompositeOperation = light ? 'source-over' : 'lighter';
        const now = Date.now();
        if (now < fxUntil && now >= fxNext) { spawnShell(); fxNext = now + 220 + Math.random() * 180; }
        fxParts = fxParts.filter(p => {
            p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.life -= p.decay;
            if (p.life <= 0) return false;
            const alpha = Math.max(0, Math.min(1, p.life));
            fxCtx.strokeStyle = `hsla(${p.hue}, 95%, ${light ? 42 : 66}%, ${alpha})`;
            fxCtx.lineWidth = p.size;
            fxCtx.beginPath();
            fxCtx.moveTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);   // 拖尾
            fxCtx.lineTo(p.x, p.y);
            fxCtx.stroke();
            return true;
        });
        if (now < fxUntil || fxParts.length) fxRaf = requestAnimationFrame(fxStep);
        else stopFireworks();
    }
    function launchFireworks() {
        // 尊重系统「减弱动效」偏好
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        stopFireworks();
        sizeFx();
        fxUntil = Date.now() + 3000;      // 约 3 秒内在整屏陆续放十来发，随后自然消散
        fxNext = 0;
        spawnShell(); spawnShell(); spawnShell(); spawnShell();
        fxRaf = requestAnimationFrame(fxStep);
    }
    function stopFireworks() {
        if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = null; }
        fxParts = []; fxUntil = 0;
        if (fxCanvas.width) fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }
    window.addEventListener('resize', () => { if (fxRaf) sizeFx(); });

    function finishTyping() {
        if (state.isComplete) return;
        state.isComplete = true; state.isTyping = false;
        exitImmersive();
        quoteDisplay.classList.remove('active');
        document.querySelector('.char.current')?.classList.remove('current');
        quoteInput.value = ''; state.isComposing = false; quoteInput.blur();
        overlay.classList.add('show');
        showCelebration();     // 随机一句名人名言
        launchFireworks();     // 🎆 放一轮烟花
    }
    function resetAndNew() {
        if (container.classList.contains('immersive')) return;
        loadNewQuote();
    }

    // ==================== 输入跟随定位 ====================
    /**
     * 输入法锚点跟随「当前待输入字符」：每个字符确认后（组字结束）重算一次。
     * ⚠ 组字过程中绝不移动锚点 —— 移动会让原生候选窗反复跳位（Edge 上甚至不弹窗），
     * 这也是为什么只在「非组字」时刻（提交后/退格后/换篇/窗口尺寸变化）才更新锚点。
     */
    function getImeAnchor() {
        const target = quoteDisplay.querySelector('.char.current') || quoteDisplay.querySelector('.char');
        if (!target) return null;
        const cRect = container.getBoundingClientRect();
        const tRect = target.getBoundingClientRect();
        return {
            el: target,                                   // 记住锚点字符，用于判断是否需要重算
            left: tRect.left - cRect.left - container.clientLeft,
            // 输入框底边与当前字符所在行盒底边重合，候选窗从字符正下方弹出。
            top: tRect.bottom - cRect.top - container.clientTop - quoteInput.offsetHeight
        };
    }

    function syncInputPosition(force = false) {
        // 组字过程中绝不移动输入框：会打断真实 IME 的组合状态。
        if (state.isComposing) return;
        // 锚点字符变了（或强制/首次）才重算，避免无谓的布局测量。
        const cur = quoteDisplay.querySelector('.char.current');
        if (!imeAnchor || force || (cur && imeAnchor.el !== cur)) imeAnchor = getImeAnchor();
        const anchor = imeAnchor;
        if (!anchor) return;
        // textarea 文本右对齐 ⇒ 其右边界即 IME 光标锚点，对齐到当前字符左缘。
        quoteInput.style.left = (anchor.left - quoteInput.offsetWidth) + 'px';
        quoteInput.style.top = anchor.top + 'px';
        quoteInput.style.letterSpacing = '';
        quoteInput.scrollLeft = 0;
    }
    // 只有布局尺寸变化时才需要重新测量；滚动不会改变相对容器坐标。
    window.addEventListener('resize', () => {
        imeAnchor = null;
        syncInputPosition(true);
    });

    /**
     * textarea 每次判定后都会被清空，让下一次组字从「当前字符」的新锚点开始，
     * 所以它的内容只是「本次新提交」的那一段，必须接到已确认串后面才是完整的已输入文本。
     */
    function typedBuffer() {
        return state.confirmedValue + quoteInput.value;
    }

    /**
     * Edge 的原生输入法会跟随组字光标，而不只跟随 textarea 的元素矩形。
     * 抵消拼音字符的总前进宽度，让组字光标始终留在初始锚点；不改元素位置或尺寸。
     */
    let compMeasurer = null;
    function lockCompositionCaret() {
        const value = quoteInput.value || '';
        const charCount = [...value].length;
        if (!charCount) { quoteInput.style.letterSpacing = ''; return; }
        if (!compMeasurer) {
            compMeasurer = document.createElement('span');
            compMeasurer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;pointer-events:none;letter-spacing:0;';
            document.body.appendChild(compMeasurer);
        }
        compMeasurer.style.font = getComputedStyle(quoteInput).font;
        compMeasurer.textContent = value;
        const textWidth = compMeasurer.getBoundingClientRect().width;
        quoteInput.style.letterSpacing = (-textWidth / charCount) + 'px';
        quoteInput.scrollLeft = 0;
    }

    // ==================== 渲染引擎 ====================
    function renderFrozenState() {
        const chars = quoteDisplay.querySelectorAll('.char');
        const pos = state.confirmedValue.length;
        let correct = 0;
        chars.forEach((s, i) => {
            s.classList.remove('correct','incorrect','current');
            if (i < pos) {
                if (state.confirmedValue[i] === [...state.quote][i]) { s.classList.add('correct'); correct++; }
                else s.classList.add('incorrect');
            } else if (i === pos) s.classList.add('current');
        });
        state.correctCount = correct;
        state.totalConfirmed = pos;
        syncInputPosition();
    }

    /**
     * 每次验证后立即清空 textarea 并重置 caret。
     */
    function validateAndRender(value) {
        if (state.isLoading || state.isComplete) return;
        const prevLen = state.confirmedValue.length;
        const chars = quoteDisplay.querySelectorAll('.char');
        state.correctCount = 0; state.totalConfirmed = value.length;
        chars.forEach((s, i) => {
            s.classList.remove('correct','incorrect','current');
            if (i < value.length) {
                if (value[i] === [...state.quote][i]) { s.classList.add('correct'); state.correctCount++; }
                else s.classList.add('incorrect');
            } else if (i === value.length) s.classList.add('current');
        });
        if (value.length > prevLen) {
            const now = Date.now();
            if (!state.firstConfirmTime) state.firstConfirmTime = now;
            state.lastConfirmTime = now;
        }
        state.confirmedValue = value;

        // 立即清空值并重置 caret，下一次组字从新的当前字符开始。
        quoteInput.value = '';
        state.confirmedValue = value; // 保留逻辑值用于比对
        requestAnimationFrame(() => {
            try { quoteInput.setSelectionRange(0, 0); } catch(e) {}
        });

        // 提交后重画光标，并把输入法锚点前移到新的当前字符（组字结束后才动，不会打断 IME）
        syncInputPosition();
        if (value.length >= state.quote.length) finishTyping();
    }

    // ==================== 事件绑定 ====================
    quoteInput.addEventListener('compositionstart', () => {
        if (state.isLoading || state.isComplete) return;
        state.isComposing = true; renderFrozenState(); lockCompositionCaret();
    });
    quoteInput.addEventListener('compositionupdate', lockCompositionCaret);
    quoteInput.addEventListener('compositionend', () => {
        if (state.isLoading || state.isComplete) return;
        state.isComposing = false;
        requestAnimationFrame(() => validateAndRender(typedBuffer()));
    });
    quoteInput.addEventListener('input', () => {
        if (state.isLoading || state.isComplete) {
            quoteInput.value = '';
            return;
        }
        if (!state.isTyping && quoteInput.value.length > 0) { state.isTyping = true; startTimer(); }
        setCursorHidden(true);   // 每次输入都重新收起（鼠标动过会显示，继续打字就再收起）
        if (state.isComposing) { renderFrozenState(); lockCompositionCaret(); }
        else validateAndRender(typedBuffer());
    });

    /**
     * 退格删除：textarea 每次判定后都被清空，退格时框内本就无字可删，
     * 浏览器不会派发 input 事件，所以必须手动回退「已确认串」的最后一个字符。
     */
    quoteInput.addEventListener('keydown', e => {
        if (e.key !== 'Backspace') return;
        if (state.isLoading) return;
        if (overlay.classList.contains('show')) return;         // 已完成，允许重开一篇而不是回退
        if (state.isComposing || e.isComposing || e.keyCode === 229) return; // 组字中：让 IME 自己删拼音
        if (quoteInput.value !== '') return;                    // 框内还有字：交给浏览器正常删
        if (state.confirmedValue.length === 0) return;
        e.preventDefault();
        state.confirmedValue = state.confirmedValue.slice(0, -1);
        renderFrozenState();
    });

    /** 打字中隐藏鼠标指针；移动鼠标 / 退出沉浸 / 完成时恢复，避免用户找不到光标 */
    function setCursorHidden(on) { document.body.classList.toggle('hide-cursor', on); }

    // 鼠标一动就把指针还回来（位移 <3px 的抖动忽略，否则碰一下桌子就闪出来）
    let lastMouse = null;
    document.addEventListener('mousemove', e => {
        const prev = lastMouse;
        lastMouse = { x: e.clientX, y: e.clientY };
        if (!prev || !document.body.classList.contains('hide-cursor')) return;
        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        if (dx * dx + dy * dy < 9) return;
        setCursorHidden(false);
    });

    function enterImmersive() {
        if (!state.isLoading && !overlay.classList.contains('show')) {
            container.classList.add('immersive');
            newQuoteBtn.disabled = true;
            setCursorHidden(true);       // 一点进打字区就收起鼠标，不用等第一个字
        }
    }
    function exitImmersive() {
        container.classList.remove('immersive');
        newQuoteBtn.disabled = false;
        setCursorHidden(false);      // 退出沉浸就把鼠标还回来
    }

    quoteDisplay.addEventListener('click', () => {
        if (!state.isLoading) {
            enterImmersive();
            quoteInput.focus();
        }
    });
    document.addEventListener('pointerdown', e => {
        if (!container.classList.contains('immersive') || quoteDisplay.contains(e.target) || e.target === quoteInput) return;
        exitImmersive();
        quoteDisplay.classList.remove('active');
        quoteInput.blur();
    });
    quoteInput.addEventListener('focus', () => {
        if (!state.isLoading) { quoteDisplay.classList.add('active'); }
    });

    quoteInput.addEventListener('blur', () => {
        if (!state.isComposing) quoteDisplay.classList.remove('active');
    });
    // 切标签页 / 最小化 / 窗口失焦：不再暂停，只退出沉浸（把界面和鼠标还回来）
    window.addEventListener('blur', exitImmersive);
    document.addEventListener('visibilitychange', () => { if (document.hidden) exitImmersive(); });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            e.preventDefault();
            if (overlay.classList.contains('show')) { resetAndNew(); return; }
            exitImmersive();          // 暂停已移除：ESC 改为退出沉浸（把界面和鼠标还回来）
            quoteInput.blur();
        }
        if (e.key === 'Tab') { e.preventDefault(); resetAndNew(); }
    });

    newQuoteBtn.addEventListener('click', resetAndNew);

    loadNewQuote();      // 线上优先：首屏先拉线上短文，失败自动兜底内置库
</script>
</body>
</html>
